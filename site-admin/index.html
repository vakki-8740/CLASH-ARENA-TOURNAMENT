<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Admin Panel -->
    <div class="admin-panel show" id="admin-panel">
        <div class="admin-panel-header">
            <h2><i class="fas fa-cog"></i> Admin Panel</h2>
            <button class="admin-close-btn" onclick="closeAdminPanel()"><i class="fas fa-times"></i></button>
        </div>
        <div class="admin-panel-body">
            <div class="admin-tabs">
                <button class="admin-tab active" onclick="switchAdminTab('content',this)"><i class="fas fa-edit"></i> Content</button>
                <button class="admin-tab" onclick="switchAdminTab('social',this)"><i class="fas fa-share-alt"></i> Social</button>
                <button class="admin-tab" onclick="switchAdminTab('testimonials',this)"><i class="fas fa-quote-right"></i> Testimonials</button>
                <button class="admin-tab" onclick="switchAdminTab('features',this)"><i class="fas fa-star"></i> Features</button>
                <button class="admin-tab" onclick="switchAdminTab('admin',this)"><i class="fas fa-shield-alt"></i> Admin</button>
            </div>

            <!-- Content -->
            <div class="admin-section active" id="admin-content-section">
                <div class="admin-field"><label>App Name</label><input id="ac-appName" placeholder="QBIT SPORTS"></div>
                <div class="admin-field"><label>App Logo URL <small>(image URL, replaces text logo)</small></label><input id="ac-appLogo" placeholder="https://example.com/logo.png"></div>
                <div class="admin-field"><label>Tagline</label><input id="ac-tagline" placeholder="Compete. Win. Repeat."></div>
                <div class="admin-field"><label>App URL</label><input id="ac-appUrl" placeholder="https://yourdomain.com/user/"></div>
                <div class="admin-field-sep"><i class="fas fa-palette"></i> Hero Section</div>
                <div class="admin-field"><label>Badge</label><input id="ac-heroBadge" placeholder="🔥 New Tournament Every Week"></div>
                <div class="admin-field"><label>Heading <small>(HTML allowed)</small></label><textarea id="ac-heroHeading" placeholder="Compete in <span>Epic</span> Tournaments"></textarea></div>
                <div class="admin-field"><label>Subtext</label><textarea id="ac-heroSubtext" placeholder="Join thousands of players..."></textarea></div>
                <div class="admin-field-sep"><i class="fas fa-heading"></i> Section Headings</div>
                <div class="admin-field"><label>Features Heading</label><input id="ac-featuresHeading" placeholder="Why Choose Us?"></div>
                <div class="admin-field"><label>Features Sub</label><input id="ac-featuresSub" placeholder="Discover what makes us unique"></div>
                <div class="admin-field"><label>How It Works Heading</label><input id="ac-howHeading" placeholder="How It Works"></div>
                <div class="admin-field"><label>How It Works Sub</label><input id="ac-howSub" placeholder="Get started in 3 easy steps"></div>
                <div class="admin-field"><label>Testimonials Heading</label><input id="ac-testHeading" placeholder="What Players Say"></div>
                <div class="admin-field"><label>Testimonials Sub</label><input id="ac-testSub" placeholder="Join thousands of happy players"></div>
                <div class="admin-field-sep"><i class="fas fa-megaphone"></i> CTA Section</div>
                <div class="admin-field"><label>CTA Heading <small>(HTML allowed)</small></label><textarea id="ac-ctaHeading" placeholder="Ready to <span>Compete</span>?"></textarea></div>
                <div class="admin-field"><label>CTA Subtext</label><textarea id="ac-ctaSub" placeholder="Download now and start playing!"></textarea></div>
                <div class="admin-field-sep"><i class="fas fa-shoe-prints"></i> Footer</div>
                <div class="admin-field"><label>Footer Description</label><textarea id="ac-footerDesc" placeholder="The ultimate tournament platform..."></textarea></div>
                <div class="admin-field"><label>Copyright <small>(HTML allowed)</small></label><input id="ac-footerCopy" placeholder="&copy; 2025 QBIT SPORTS. All rights reserved."></div>
                <button class="admin-save-btn" onclick="saveSiteContent()"><i class="fas fa-save"></i> Save Content</button>
            </div>

            <!-- Social -->
            <div class="admin-section" id="admin-social-section">
                <div class="admin-field"><label><i class="fab fa-telegram"></i> Telegram URL</label><input id="ac-telegram" placeholder="https://t.me/yourgroup"></div>
                <div class="admin-field"><label><i class="fab fa-instagram"></i> Instagram URL</label><input id="ac-instagram" placeholder="https://instagram.com/yourpage"></div>
                <div class="admin-field"><label><i class="fab fa-youtube"></i> YouTube URL</label><input id="ac-youtube" placeholder="https://youtube.com/@yourchannel"></div>
                <div class="admin-field"><label><i class="fas fa-envelope"></i> Email</label><input id="ac-email" placeholder="admin@example.com"></div>
                <button class="admin-save-btn" onclick="saveSiteSocial()"><i class="fas fa-save"></i> Save Social Links</button>
            </div>

            <!-- Testimonials -->
            <div class="admin-section" id="admin-testimonials-section">
                <div class="admin-field-sep"><i class="fas fa-plus-circle"></i> Add Testimonial</div>
                <div class="admin-field"><label>Name</label><input id="atm-name" placeholder="Player name"></div>
                <div class="admin-field"><label>Role</label><input id="atm-role" placeholder="Champion, Pro Player, etc."></div>
                <div class="admin-field"><label>Icon <small>(star, trophy, gamepad, bolt)</small></label>
                    <select id="atm-icon"><option value="star">Star</option><option value="trophy">Trophy</option><option value="gamepad">Gamepad</option><option value="bolt">Bolt</option></select>
                </div>
                <div class="admin-field"><label>Quote</label><textarea id="atm-quote" placeholder="What they said..."></textarea></div>
                <button class="admin-save-btn" onclick="addTestimonial()"><i class="fas fa-plus"></i> Add Testimonial</button>
                <div class="admin-field-sep"><i class="fas fa-list"></i> Existing Testimonials</div>
                <div id="testimonials-admin-list"></div>
            </div>

            <!-- Features -->
            <div class="admin-section" id="admin-features-section">
                <div class="admin-field-sep"><i class="fas fa-plus-circle"></i> Add Feature</div>
                <div class="admin-field"><label>Icon <small>(trophy, bolt, shield-alt, mobile-alt, headset, users)</small></label>
                    <select id="afe-icon">
                        <option value="trophy">Trophy</option><option value="bolt">Bolt</option>
                        <option value="shield-alt">Shield</option><option value="mobile-alt">Mobile</option>
                        <option value="headset">Headset</option><option value="users">Users</option>
                    </select>
                </div>
                <div class="admin-field"><label>Title</label><input id="afe-title" placeholder="Feature title"></div>
                <div class="admin-field"><label>Description</label><textarea id="afe-desc" placeholder="Feature description"></textarea></div>
                <button class="admin-save-btn" onclick="addFeature()"><i class="fas fa-plus"></i> Add Feature</button>
                <div class="admin-field-sep"><i class="fas fa-list"></i> Existing Features</div>
                <div id="features-admin-list"></div>
            </div>

            <!-- Admin Settings -->
            <div class="admin-section" id="admin-admin-section">
                <div class="admin-field-sep"><i class="fas fa-key"></i> Change Admin Password</div>
                <div class="admin-field"><label>New Password</label><input id="ac-adminPass" type="password" placeholder="Enter new password"></div>
                <button class="admin-save-btn" onclick="saveAdminSettings()"><i class="fas fa-save"></i> Update Password</button>
                <div class="admin-field-sep"><i class="fas fa-sync"></i> Quick Actions</div>
                <button class="admin-save-btn" onclick="refreshSiteStats()" style="background:var(--primary);"><i class="fas fa-chart-bar"></i> Refresh Site Stats</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
